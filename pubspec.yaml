name: boardmate
description: "BoardMate — learn how to play physical board games."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Dependency injection
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.6.2

  # Immutable models + codegen annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Domain / errors
  fpdart: ^1.1.0
  equatable: ^2.0.5

  # Networking
  http: ^1.2.2

  # Layout / theming
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Local storage / images
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1

  # Misc
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/illustrations/
